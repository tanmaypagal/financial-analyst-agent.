# ===========================================================================
#  RUBRIC TEMPLATE  -  YOU (the reviewer) WRITE THIS.
#  Copy to eval/rubrics/<name>.yaml, replace every <<PLACEHOLDER>>, and run:
#      python -m eval.run_eval --judge <name>
#  The judge refuses to run while any "<<" placeholder remains.
# ===========================================================================
name: <<RUBRIC NAME, e.g. persona_quality_v1>>
scale: {min: 1, max: 5}
judge_instructions: |
  <<INSTRUCTIONS TO THE JUDGE: what to reward and penalise; how to treat missing data; what "grounded" means.>>
criteria:
  - id: <<criterion_id_1, e.g. grounding>>
    description: <<what this criterion assesses>>
    anchors:                       # optional score anchors
      1: <<what a 1 looks like>>
      3: <<what a 3 looks like>>
      5: <<what a 5 looks like>>
  - id: <<criterion_id_2, e.g. persona_fidelity>>
    description: <<...>>
    anchors: {1: <<...>>, 3: <<...>>, 5: <<...>>}
  # add as many criteria as you need
pass_threshold: <<e.g. 3.5 - mean score needed to pass>>
